<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Nilai Saya</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="nav-container"></div>

<style>
    .rekap-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; margin-bottom: 20px; }
    .rekap-table th, .rekap-table td { border: 1px solid #333; padding: 9px 5px; text-align: center; }
    .rekap-table th { background-color: #2c3e50; color: white; }
    .rekap-table td.nama-mapel { text-align: left !important; font-weight: bold; background: #f8f9fa; }
    .col-na { font-weight: bold; background-color: #d4edda; color: #155724; }
    .kop-surat { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 20px; text-align: center; font-weight: bold; }
    .kop-surat img { width: 80px; height: auto; }
    .kop-text h3 { margin: 0; font-size: 16px; font-weight: bold; }
    .kop-text h2 { margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 1px; }
    .kop-text p { margin: 2px 0 0 0; font-size: 12px; font-weight: bold; }
    .kartu-murid { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 14px 18px; margin-bottom: 18px; }
    .kartu-murid .nama { font-size: 20px; font-weight: bold; color: #1e293b; }
    .kartu-murid .nis { font-size: 14px; color: #475569; font-weight: bold; }
    .ringkas { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .ringkas .kotak { flex: 1; min-width: 150px; background: #fff; border: 1px solid #dee2e6; border-radius: 6px; padding: 14px; text-align: center; }
    .ringkas .kotak .nilai { font-size: 26px; font-weight: bold; color: #007bff; }
    .ringkas .kotak .label { font-size: 12px; color: #666; margin-top: 4px; }
    .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #28a745; margin-right: 6px; animation: kedip 1.5s infinite; }
    @keyframes kedip { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    @media print {
        @page { size: A4 portrait; margin: 1cm; }
        .no-print, .nav-container { display: none !important; }
        body { background: white; padding: 0; color: #000; }
        .container { margin: 0; padding: 0; box-shadow: none; max-width: 100%; }
        .rekap-table th { background-color: #ddd !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .col-na { background-color: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>

<h2>📋 Rekap Nilai Saya</h2>
<p style="font-size:13px; color:#666; margin-top:-8px;" class="no-print">
    <span class="live-dot"></span>Data diperbarui <strong>otomatis & langsung</strong> setiap kali guru menyimpan nilai baru.
</p>

<div class="no-print" style="margin-bottom:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#e2e8f0; padding:12px 15px; border-radius:5px;">
    <label style="font-weight:bold; font-size:14px;">Semester:</label>
    <select id="selSemester" onchange="render()" style="padding:6px; border-radius:4px;"></select>
    <button type="button" class="btn btn-primary" onclick="window.print()" style="margin-left:auto;">🖨️ Cetak</button>
</div>

<div id="wadahIsi">Memuat data...</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
<script>
    let db, semester = 'Ganjil';

    function kopSurat(c) {
        if (c.gunakan_kop !== 'ya') return '';
        const kiri = c.logo_kiri ? `<img src="${Util.esc(c.logo_kiri)}" alt="Logo Kiri">` : '';
        const kanan = c.logo_kanan ? `<img src="${Util.esc(c.logo_kanan)}" alt="Logo Kanan">` : '';
        return `<div class="kop-surat">
            <div>${kiri}</div>
            <div class="kop-text">
                <h3>${Util.esc(c.instansi_1 || '')}</h3>
                <h3>${Util.esc(c.instansi_2 || '')}</h3>
                <h2>${Util.esc(c.nama_sekolah || '')}</h2>
                <p>${Util.esc(c.alamat_sekolah || '')}</p>
                <p>Email: ${Util.esc(c.email_sekolah || '')}</p>
            </div>
            <div>${kanan}</div>
        </div>`;
    }

    function render() {
        semester = document.getElementById('selSemester').value;
        const murid = Auth.muridAktif();
        if (!murid) { Auth.logout(); return; }

        const mapel = window.SUBJECTS;
        let totalNA = 0, jumlahNA = 0;

        const baris = mapel.map(m => {
            const g = Util.nilai(db, murid.id, m, semester);
            const na = Util.hitungNA(g);
            if (na > 0) { totalNA += na; jumlahNA++; }
            return `<tr>
                <td class="nama-mapel">${Util.esc(m)}</td>
                <td>${Util.tampilNilai(g && g.ph1)}</td>
                <td>${Util.tampilNilai(g && g.ph2)}</td>
                <td>${Util.tampilNilai(g && g.ph3)}</td>
                <td>${Util.tampilNilai(g && g.ph4)}</td>
                <td>${Util.tampilNilai(g && g.ats)}</td>
                <td>${Util.tampilNilai(g && g.aas)}</td>
                <td class="col-na">${na > 0 ? Math.round(na) : '-'}</td>
            </tr>`;
        }).join('');

        const rata = jumlahNA ? (totalNA / jumlahNA) : 0;
        const tertinggi = jumlahNA ? Math.round(Math.max(...mapel.map(m => Util.hitungNA(Util.nilai(db, murid.id, m, semester))))) : 0;

        document.getElementById('wadahIsi').innerHTML = `
            ${kopSurat(db.config)}

            <div class="kartu-murid">
                <div>
                    <div class="nama">${Util.esc(murid.name)}</div>
                    <div class="nis">NIS: ${Util.esc(murid.nis || '-')}</div>
                </div>
                <div style="text-align:right; font-size:14px; color:#475569;">
                    Kelas III<br>Semester ${Util.esc(semester)}
                </div>
            </div>

            <div class="ringkas">
                <div class="kotak"><div class="nilai">${jumlahNA ? Math.round(rata) : '-'}</div><div class="label">Rata-rata Nilai Akhir</div></div>
                <div class="kotak"><div class="nilai">${tertinggi || '-'}</div><div class="label">Nilai Tertinggi</div></div>
                <div class="kotak"><div class="nilai">${jumlahNA}/${mapel.length}</div><div class="label">Mapel Sudah Dinilai</div></div>
            </div>

            <table class="rekap-table">
                <thead>
                    <tr>
                        <th style="text-align:left;">Mata Pelajaran</th>
                        <th>PH1</th><th>PH2</th><th>PH3</th><th>PH4</th>
                        <th>ATS</th><th>AAS</th>
                        <th class="col-na">NA</th>
                    </tr>
                </thead>
                <tbody>${baris}
                    <tr>
                        <td class="nama-mapel">RATA-RATA</td>
                        <td colspan="6" style="background:#f8f9fa; font-style:italic; color:#666;">Nilai Akhir Seluruh Mata Pelajaran</td>
                        <td class="col-na">${jumlahNA ? Math.round(rata) : '-'}</td>
                    </tr>
                </tbody>
            </table>

            <p style="font-size:12px; color:#666; text-align:center;" class="no-print">
                Terakhir diperbarui: ${new Date().toLocaleString('id-ID')}
            </p>`;
    }

    (async function () {
        if (!Header.init('murid', 'murid')) return;

        db = await Store.init();
        if (!Auth.muridAktif()) { Auth.logout(); return; }

        Util.isiSelect(document.getElementById('selSemester'), window.SEMESTERS, semester);
        render();

        Store.onRemote(d => { db = d; render(); });
        Store.mulaiPolling();
    })();
</script>
</div>
</body>
</html>
